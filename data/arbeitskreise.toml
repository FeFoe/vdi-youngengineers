# Arbeitskreise für den Filter „Meine Arbeitskreise“ und den Kalender /kalender/auswahl.ics?ak=…
# Wird von tools/vdi_termine.py (Zuordnung) und von Hugo (Auswahlliste) gelesen.
#
# Je Arbeitskreis:
#   name        Anzeigename auf der Website
#   ak          regulärer Ausdruck für den Namen des Arbeitskreises auf vdi.de. Wird mit den Zeilen
#               „AK …“ / „Arbeitskreis …“ unter „Auf einen Blick“ verglichen – passt damit auch bei
#               gleichnamigen Arbeitskreisen anderer Bezirksvereine.
#   stichworte  regulärer Ausdruck für Titel und Teaser. Gilt nur für Termine ohne Arbeitskreis
#               (VDI-Webinare, Landesverband, „Hamburger Arbeitskreise“ allgemein). Ein Termin darf
#               dabei in mehreren Arbeitskreisen landen.
# Groß-/Kleinschreibung egal. Schlüssel (z. B. „medizintechnik“) nur aus a–z, 0–9 und Bindestrich:
# Er steht im Kalender-Link und im Browser gespeichert, also später nicht mehr umbenennen.
# Nicht aufgenommen, weil keine Fach-Arbeitskreise: Hamburger Arbeitskreise (Sammelbegriff),
# AK SuJ-Hamburg, BGr Lüneburg, Hamburger VDI-Preis, VDI Betriebsingenieure Regionalgruppe Nord,
# Young Engineers Hamburg (immer sichtbar), VDIni-Clubs, Zukunftspiloten, Vorstand (ausgeschlossen).

[bahntechnik]
name = "Bahntechnik"
ak = 'Bahntechnik'
stichworte = '\bBahn|Schiene|Eisenbahn|(?-i:\bICE\b)'

